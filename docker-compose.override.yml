# Dev-only: exposed ports, hot reload, source mounted over the image copy.
#
# Host ports are deliberately off-by-one from the defaults: a machine that
# already runs its own Postgres/Redis would otherwise shadow these containers.
services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  api:
    environment:
      DEBUG: "true"
      DB_ECHO: "false"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    environment:
      DEBUG: "true"
      # Without this the mount below does nothing. `arq` is a console script, so
      # sys.path[0] is the venv's bin directory rather than the working
      # directory, and `import app` finds the copy the image pip-installed into
      # site-packages -- which never changes. uvicorn puts the working directory
      # first itself, which is why only the worker needs telling.
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
    # `watchfiles` rather than `arq --watch`: arq's own watcher restarts the
    # worker loop inside the same interpreter, so anything already in
    # sys.modules keeps the code it was imported with and an edit appears to
    # reload while changing nothing. This one replaces the process.
    command: ["watchfiles", "arq app.worker.WorkerSettings", "/app/app"]
